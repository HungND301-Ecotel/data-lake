spring:
  application:
    name: report
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # Lược đồ do Flyway quản lý. validate chỉ đối chiếu entity với schema và
      # báo lỗi khi lệch, thay vì tự sửa bảng như ddl-auto: update.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    # Phải là false: lược đồ do Flyway dựng, không phải Hibernate. Bật defer sẽ
    # khiến Boot bắt Flyway chờ EntityManagerFactory và sinh phụ thuộc vòng.
    defer-datasource-initialization: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    # Cơ sở dữ liệu đang chạy đã có sẵn bảng do ddl-auto tạo ra, nên được đánh
    # mốc sang phiên bản 1 mà không chạy lại baseline.
    baseline-on-migrate: true
    baseline-version: 1
    # Không cho phép sửa file migration đã chạy; muốn đổi thì viết file mới.
    validate-on-migrate: true
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
server:
  port: 8080
  servlet:
    context-path: /api

# Chỉ mở đúng health cho probe của Docker/orchestrator; show-details: never để
# không lộ thông tin nội bộ (DB, disk) ra ngoài.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

aws:
  accessKeyId: ${AWS_ACCESSKEYID}
  secretAccessKey: ${AWS_SECRETACCESSKEY}
  s3:
    bucket: ${AWS_S3_BUCKET}
    # Object storage tại chỗ (MinIO, Ceph RGW). Bỏ trống thì dùng endpoint AWS.
    endpoint: ${AWS_S3_ENDPOINT:}
  region: ${AWS_REGION}

jwt:
  secret: ${JWT_SECRET}

webclient:
  base-url: https://apidatabi.vinacomin.vn
  connection-timeout: 5000
  read-timeout: 10000

datalake:
  base-url: ${DATALAKE_BASE_URL:http://113.22.123.208:1313}

account:
  username: ${USERNAME_VINA}
  password: ${PASSWORD_VINA}

