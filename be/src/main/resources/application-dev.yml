spring:
  application:
    name: report
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  datasource:
    url: jdbc:postgresql://localhost:5434/report
    username: admin
    password: admin
  jpa:
    hibernate:
      # Xem ghi chú ở application-prod.yml: lược đồ do Flyway quản lý.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    # Xem ghi chú ở application-prod.yml.
    defer-datasource-initialization: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
server:
  port: 8080
  servlet:
    context-path: /api

aws:
  accessKeyId: ${AWS_ACCESSKEYID}
  secretAccessKey: ${AWS_SECRETACCESSKEY}
  s3:
    bucket: ${AWS_S3_BUCKET}
    endpoint: ${AWS_S3_ENDPOINT:}
  region: ${AWS_REGION}

jwt:
  secret: ${JWT_SECRET}

datalake:
  base-url: http://113.22.123.208:1313

account:
  username: ${USERNAME_VINA}
  password: ${PASSWORD_VINA}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
