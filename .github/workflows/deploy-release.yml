# ============================================================
# RELEASE DEPLOY WORKFLOW - MULTI-TENANT
# ============================================================
# Cách dùng:
#   1. Merge code vào nhánh main
#   2. Vào GitHub Actions → "Deploy Release" → "Run workflow"
#   3. Chọn tenant cần release → Run
#
# Secrets cần thiết cho mỗi tenant (thay {TENANT} bằng tên viết hoa):
#   {TENANT}_HOST         - IP/hostname VPS production
#   {TENANT}_USER         - SSH username
#   {TENANT}_SSH_KEY      - SSH private key
#   {TENANT}_PORT         - SSH port
#
# ⚠️ VITE_API KHÔNG còn dùng nữa.
# FE dùng relative path /api → Nginx reverse proxy forward sang BE.
# Không cần secret {TENANT}_VITE_API.
#
# Secrets dùng chung:
#   DOCKER_HUB_USERNAME
#   DOCKER_HUB_ACCESS_TOKEN
# ============================================================

name: Deploy Release

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: "Chọn tenant để release lên production"
        required: true
        type: choice
        options:
          - deonaicocsau
          - uongbi

env:
  WEBAPP_NAME: data-lake
  NODE_VERSION: "20.x"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set TENANT_UPPER (dùng để lookup secrets)
        id: tu
        run: |
          echo "name=$(echo '${{ github.event.inputs.tenant }}' | tr '[:lower:]' '[:upper:]')" >> $GITHUB_OUTPUT

      # ── Build .env cho FE theo tenant ────────────────────────
      - name: Create frontend .env from tenant config
        run: |
          TENANT="${{ github.event.inputs.tenant }}"
          # Copy toàn bộ branding config (màu, logo, tên công ty...)
          cp fe-modul-report/tenants/${TENANT}.env ./fe-modul-report/.env
          # ⚠️ KHÔNG inject VITE_API nữa.
          # axiosClient dùng relative path /api → Nginx reverse proxy forward sang BE.
          # BE port không bị lộ ra ngoài internet.
          echo "=== FE .env sẽ dùng để build ==="
          grep -v "^#" ./fe-modul-report/.env | grep -v "^$"

      # ── Build & push Docker images ────────────────────────────
      - name: Build and push Docker images
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          TENANT: ${{ github.event.inputs.tenant }}
        run: |
          # 1. Trích xuất REGISTRY từ .env của tenant để truyền vào Makefile build
          REGISTRY_VAL=$(grep "^REGISTRY=" ./deployment/tenants/${TENANT}/.env | cut -d'=' -f2)
          make release TENANT=${TENANT} REGISTRY=${REGISTRY_VAL}
          
          # 2. Sao chép cấu hình tenant làm file .env_tenant cho deploy
          cp ./deployment/tenants/${TENANT}/.env ./deployment/release/.env_tenant
          
          # 3. Đọc các biến VERSION, REGISTRY, TENANT_LOWER vừa được gen ra trong file .env gốc
          RELEASE_VERSION_VAL=$(grep "^VERSION=" .env | cut -d'=' -f2)
          TENANT_LOWER_VAL=$(grep "^TENANT_LOWER=" .env | cut -d'=' -f2)
          
          # 4. Ghi đè cấu hình chính xác vào file .env_tenant để deploy trên server
          sed -i "s|^VERSION=.*|VERSION=${RELEASE_VERSION_VAL}|" ./deployment/release/.env_tenant
          sed -i "s|^REGISTRY=.*|REGISTRY=${REGISTRY_VAL}|" ./deployment/release/.env_tenant
          if ! grep -q "^TENANT_LOWER=" ./deployment/release/.env_tenant; then
            echo "TENANT_LOWER=${TENANT_LOWER_VAL}" >> ./deployment/release/.env_tenant
          fi
          
          echo "=== .env_tenant file content ==="
          cat ./deployment/release/.env_tenant

      # ── Tạo thư mục trên server ───────────────────────────────
      - name: Ensure deploy directory exists on server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets[format('{0}_HOST', steps.tu.outputs.name)] }}
          username: ${{ secrets[format('{0}_USER', steps.tu.outputs.name)] }}
          key: ${{ secrets[format('{0}_SSH_KEY', steps.tu.outputs.name)] }}
          port: ${{ secrets[format('{0}_PORT', steps.tu.outputs.name)] }}
          script: mkdir -p ~/data-lake/${{ github.event.inputs.tenant }}/deployment/release

      # ── SCP: copy docker-compose + .env_tenant lên server ────
      - name: Transfer deployment files to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets[format('{0}_HOST', steps.tu.outputs.name)] }}
          username: ${{ secrets[format('{0}_USER', steps.tu.outputs.name)] }}
          key: ${{ secrets[format('{0}_SSH_KEY', steps.tu.outputs.name)] }}
          port: ${{ secrets[format('{0}_PORT', steps.tu.outputs.name)] }}
          source: "deployment/release/*"
          target: "~/data-lake/${{ github.event.inputs.tenant }}/deployment/release"
          strip_components: 2

      # ── SSH: deploy ───────────────────────────────────────────
      - name: Deploy to production server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets[format('{0}_HOST', steps.tu.outputs.name)] }}
          username: ${{ secrets[format('{0}_USER', steps.tu.outputs.name)] }}
          key: ${{ secrets[format('{0}_SSH_KEY', steps.tu.outputs.name)] }}
          port: ${{ secrets[format('{0}_PORT', steps.tu.outputs.name)] }}
          script: |
            cd ~/data-lake/${{ github.event.inputs.tenant }}/deployment/release
            chmod +x start-app.sh
            ./start-app.sh
