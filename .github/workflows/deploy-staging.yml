# ⚠️ VITE_API KHÔNG còn dùng nữa.
# FE dùng relative path /api → Nginx reverse proxy forward sang BE.
# Không cần secret {TENANT}_VITE_API.
#
# Secrets dùng chung:
#   DOCKER_HUB_USERNAME
#   DOCKER_HUB_ACCESS_TOKEN
#
# Cách thêm tenant mới:
#   1. Tạo fe-modul-report/tenants/{tenant}.env
#   2. Tạo deployment/tenants/{tenant}/.env
#   3. Thêm secrets GitHub: {TENANT_UPPER}_HOST/USER/SSH_KEY/PORT
#   4. Thêm option vào danh sách bên dưới
# ============================================================

name: Deploy Staging

on:
  push:
    branches:
      - dev

env:
  WEBAPP_NAME: data-lake
  NODE_VERSION: "20.x"

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tenant: [maokhe]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set TENANT_UPPER (dùng để lookup secrets)
        id: tu
        run: |
          echo "name=$(echo '${{ matrix.tenant }}' | tr '[:lower:]' '[:upper:]')" >> $GITHUB_OUTPUT

      # ── Build .env cho FE theo tenant ────────────────────────
      - name: Create frontend .env from tenant config
        run: |
          TENANT="${{ matrix.tenant }}"
          # Copy toàn bộ branding config (màu, logo, tên công ty...)
          cp fe-modul-report/tenants/${TENANT}.env ./fe-modul-report/.env
          # ⚠️ KHÔNG inject VITE_API nữa.
          # axiosClient dùng relative path /api → Nginx reverse proxy forward sang BE.
          # BE port không bị lộ ra ngoài internet.
          echo "=== FE .env sẽ dùng để build ==="
          grep -v "^#" ./fe-modul-report/.env | grep -v "^$"

      # ── Build & push Docker images ────────────────────────────
      - name: Build and push Docker images
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          TENANT: ${{ matrix.tenant }}
        run: |
          # 1. Sử dụng DOCKER_HUB_USERNAME làm REGISTRY để build và push
          REGISTRY_VAL="${{ secrets.DOCKER_HUB_USERNAME }}"
          make staging TENANT=${TENANT} REGISTRY=${REGISTRY_VAL}

          # 2. Sao chép cấu hình tenant làm file .env_tenant cho deploy
          cp ./deployment/tenants/${TENANT}/.env ./deployment/staging/.env_tenant

          # 3. Đọc các biến VERSION, REGISTRY, TENANT_LOWER vừa được gen ra trong file .env gốc
          STAGING_VERSION_VAL=$(grep "^VERSION=" .env | cut -d'=' -f2)
          TENANT_LOWER_VAL=$(grep "^TENANT_LOWER=" .env | cut -d'=' -f2)

          # 4. Ghi đè cấu hình chính xác vào file .env_tenant để deploy trên server
          sed -i "s|^VERSION=.*|VERSION=${STAGING_VERSION_VAL}|" ./deployment/staging/.env_tenant
          sed -i "s|^REGISTRY=.*|REGISTRY=${REGISTRY_VAL}|" ./deployment/staging/.env_tenant
          if ! grep -q "^TENANT_LOWER=" ./deployment/staging/.env_tenant; then
            echo "TENANT_LOWER=${TENANT_LOWER_VAL}" >> ./deployment/staging/.env_tenant
          fi

          echo "=== .env_tenant file content ==="
          cat ./deployment/staging/.env_tenant

      # ── Tạo thư mục trên server ───────────────────────────────
      - name: Ensure deploy directory exists on server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets[format('{0}_HOST', steps.tu.outputs.name)] }}
          username: ${{ secrets[format('{0}_USER', steps.tu.outputs.name)] }}
          key: ${{ secrets[format('{0}_SSH_KEY', steps.tu.outputs.name)] }}
          port: ${{ secrets[format('{0}_PORT', steps.tu.outputs.name)] }}
          script: mkdir -p ~/data-lake/${{ matrix.tenant }}/deployment/staging

      # ── SCP: copy docker-compose + .env_tenant lên server ────
      - name: Transfer deployment files to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets[format('{0}_HOST', steps.tu.outputs.name)] }}
          username: ${{ secrets[format('{0}_USER', steps.tu.outputs.name)] }}
          key: ${{ secrets[format('{0}_SSH_KEY', steps.tu.outputs.name)] }}
          port: ${{ secrets[format('{0}_PORT', steps.tu.outputs.name)] }}
          source: "deployment/staging/*"
          target: "~/data-lake/${{ matrix.tenant }}/deployment/staging"
          strip_components: 2

      # ── SSH: deploy ───────────────────────────────────────────
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets[format('{0}_HOST', steps.tu.outputs.name)] }}
          username: ${{ secrets[format('{0}_USER', steps.tu.outputs.name)] }}
          key: ${{ secrets[format('{0}_SSH_KEY', steps.tu.outputs.name)] }}
          port: ${{ secrets[format('{0}_PORT', steps.tu.outputs.name)] }}
          script: |
            cd ~/data-lake/${{ matrix.tenant }}/deployment/staging
            chmod +x start-app.sh
            ./start-app.sh
