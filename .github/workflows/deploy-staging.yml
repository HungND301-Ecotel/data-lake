# ============================================================
# STAGING DEPLOY WORKFLOW - MULTI-TENANT
# ============================================================
# Cách dùng:
#   1. Push code lên nhánh develop
#   2. Vào GitHub Actions → "Deploy Staging" → "Run workflow"
#   3. Chọn tenant cần deploy → Run
#   4. Có thể chạy lại bất kỳ lúc nào từ Actions UI để chọn tenant khác
#
# Secrets cần thiết cho mỗi tenant (thay {TENANT} bằng tên viết hoa):
#   {TENANT}_HOST         - IP/hostname VPS của tenant
#   {TENANT}_USER         - SSH username
#   {TENANT}_SSH_KEY      - SSH private key
#   {TENANT}_PORT         - SSH port (thường 22)
#
# Secrets cho server118 (test - port 1144 đã được mở):
#   SERVER118_HOST        - IP của server 118
#   SERVER118_USER        - SSH username
#   SERVER118_SSH_KEY     - SSH private key
#   SERVER118_PORT        - SSH port (thường 22)
#
# ⚠️ VITE_API KHÔNG còn dùng nữa.
# FE dùng relative path /api → Nginx reverse proxy forward sang BE.
# Không cần secret {TENANT}_VITE_API.
#
# Secrets dùng chung:
#   DOCKER_HUB_USERNAME
#   DOCKER_HUB_ACCESS_TOKEN
#
# Cách thêm tenant mới:
#   1. Tạo fe-modul-report/tenants/{tenant}.env
#   2. Tạo deployment/tenants/{tenant}/.env
#   3. Thêm secrets GitHub: {TENANT_UPPER}_HOST/USER/SSH_KEY/PORT/VITE_API
#   4. Thêm option vào danh sách bên dưới
# ============================================================

name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: "Chọn tenant để deploy lên staging"
        required: true
        type: choice
        options:
          - deonaicocsau
          - uongbi
          - serverTest

env:
  WEBAPP_NAME: data-lake
  NODE_VERSION: "20.x"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set TENANT_UPPER (dùng để lookup secrets)
        id: tu
        run: |
          echo "name=$(echo '${{ github.event.inputs.tenant }}' | tr '[:lower:]' '[:upper:]')" >> $GITHUB_OUTPUT

      # ── Build .env cho FE theo tenant ────────────────────────
      - name: Create frontend .env from tenant config
        run: |
          TENANT="${{ github.event.inputs.tenant }}"
          # Copy toàn bộ branding config (màu, logo, tên công ty...)
          cp fe-modul-report/tenants/${TENANT}.env ./fe-modul-report/.env
          # ⚠️ KHÔNG inject VITE_API nữa.
          # axiosClient dùng relative path /api → Nginx reverse proxy forward sang BE.
          # BE port không bị lộ ra ngoài internet.
          echo "=== FE .env sẽ dùng để build ==="
          grep -v "^#" ./fe-modul-report/.env | grep -v "^$"

      # ── Build & push Docker images ────────────────────────────
      - name: Build and push Docker images
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          TENANT: ${{ github.event.inputs.tenant }}
        run: |
          make staging TENANT=${TENANT}
          # Copy infra config (ports, volumes) vào thư mục staging để SCP lên server
          cp ./deployment/tenants/${TENANT}/.env ./deployment/staging/.env_tenant

      # ── Tạo thư mục trên server ───────────────────────────────
      - name: Ensure deploy directory exists on server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets[format('{0}_HOST', steps.tu.outputs.name)] }}
          username: ${{ secrets[format('{0}_USER', steps.tu.outputs.name)] }}
          key: ${{ secrets[format('{0}_SSH_KEY', steps.tu.outputs.name)] }}
          port: ${{ secrets[format('{0}_PORT', steps.tu.outputs.name)] }}
          script: mkdir -p ~/data-lake/${{ github.event.inputs.tenant }}/deployment/staging

      # ── SCP: copy docker-compose + .env_tenant lên server ────
      - name: Transfer deployment files to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets[format('{0}_HOST', steps.tu.outputs.name)] }}
          username: ${{ secrets[format('{0}_USER', steps.tu.outputs.name)] }}
          key: ${{ secrets[format('{0}_SSH_KEY', steps.tu.outputs.name)] }}
          port: ${{ secrets[format('{0}_PORT', steps.tu.outputs.name)] }}
          source: "deployment/staging/*"
          target: "~/data-lake/${{ github.event.inputs.tenant }}/deployment/staging"
          strip_components: 2

      # ── SSH: deploy ───────────────────────────────────────────
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets[format('{0}_HOST', steps.tu.outputs.name)] }}
          username: ${{ secrets[format('{0}_USER', steps.tu.outputs.name)] }}
          key: ${{ secrets[format('{0}_SSH_KEY', steps.tu.outputs.name)] }}
          port: ${{ secrets[format('{0}_PORT', steps.tu.outputs.name)] }}
          script: |
            cd ~/data-lake/${{ github.event.inputs.tenant }}/deployment/staging
            chmod +x start-app.sh
            ./start-app.sh
