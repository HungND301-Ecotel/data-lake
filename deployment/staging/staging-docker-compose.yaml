services:
  mongduong_report_reverse_proxy_service:
    image: ${REGISTRY}/mongduong_report_reverse_proxy_img:${VERSION}
    ports:
      # HOST_PORT:CONTAINER_PORT
      - "4343:8888"
    stdin_open: true
    environment:
      - TZ=Asia/Ho_Chi_Minh
    networks:
      - backnet
      - frontnet
    depends_on:
      - mongduong_report_backend_service
      - mongduong_report_frontend_service

  mongduong_report_backend_service:
    env_file:
      - .env_backend
    image: ${REGISTRY}/mongduong_report_backend_img:${VERSION}
    depends_on:
      - postgres
    ports:
      - "8181:8080"
    networks:
      - backnet
    restart: unless-stopped

  mongduong_report_frontend_service:
    image: ${REGISTRY}/mongduong_report_frontend_img:${VERSION}
    # target: development
    stdin_open: true
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      # For development only, to synced src code to container
      - /usr/src/app/node_modules
    # restart: always
    networks:
      - frontnet

  postgres:
    container_name: pg_mongduong_report_2211
    image: postgres:16
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=report
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - mongduong_report_postgres_data:/var/lib/postgresql/data
    ports:
      - "5437:5432"
    restart: unless-stopped
    networks:
      - backnet

  pgadmin:
    container_name: pgadmin_mongduong_report_2211
    image: dpage/pgadmin4:8.6
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-pgadmin@pgadmin.org}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-admin}
      - PGADMIN_CONFIG_SERVER_MODE=False
    volumes:
      - mongduong_report_pgadmin_data:/var/lib/pgadmin
    ports:
      - "5054:80"
    restart: unless-stopped

volumes:
  mongduong_report_postgres_data: # ✅ Cho postgres
    driver: local
    driver_opts:
      type: none
      device: /mnt/hdd/mongduong_report_postgres_data
      o: bind

  mongduong_report_pgadmin_data: # ✅ Cho pgadmin (thêm mới)
    driver: local
    driver_opts:
      type: none
      device: /mnt/hdd/mongduong_report_pgadmin_data
      o: bind

networks:
  backnet:
  frontnet:
