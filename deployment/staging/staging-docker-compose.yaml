# ============================================================
# STAGING DOCKER COMPOSE - TENANT AWARE
# ============================================================
# Dùng với file .env của từng tenant:
#   docker compose --env-file tenants/deonaicocsau/.env -f staging-docker-compose.yaml up -d
#
# Hoặc qua script tự động:
#   ./deployment/scripts/deploy.sh deonaicocsau staging
# ============================================================

services:
  reverse_proxy_service:
    image: ${REGISTRY}/${TENANT}_reverse_proxy_img:${VERSION}
    ports:
      # HOST_PORT:CONTAINER_PORT - Port được định nghĩa trong file .env của tenant
      - "${PROXY_PORT}:8888"
    stdin_open: true
    environment:
      - TZ=Asia/Ho_Chi_Minh
    networks:
      - backnet
      - frontnet
    depends_on:
      - backend_service
      - frontend_service

  backend_service:
    env_file:
      - .env_backend
    image: ${REGISTRY}/${TENANT}_backend_img:${VERSION}
    depends_on:
      - postgres
    ports:
      - "${BACKEND_PORT}:8080"
    networks:
      - backnet
    restart: unless-stopped

  frontend_service:
    image: ${REGISTRY}/${TENANT}_frontend_img:${VERSION}
    stdin_open: true
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - /usr/src/app/node_modules
    networks:
      - frontnet

  postgres:
    container_name: pg_${TENANT}_report
    image: postgres:16
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=report
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - backnet

  pgadmin:
    container_name: pgadmin_${TENANT}_report
    image: dpage/pgadmin4:8.6
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-pgadmin@pgadmin.org}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-admin}
      - PGADMIN_CONFIG_SERVER_MODE=False
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT}:80"
    networks:
      - backnet
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      device: ${POSTGRES_VOLUME_PATH}
      o: bind

  pgadmin_data:
    driver: local
    driver_opts:
      type: none
      device: ${PGADMIN_VOLUME_PATH}
      o: bind

networks:
  backnet:
  frontnet: