###### Build Docker Images and push to DockerHub Repository ######
### References:
# 1. Compose build specs: https://docs.docker.com/compose/compose-file/build/
# Run the commands (TENANT is required):
# a. Build: TENANT=uongbi docker compose -f docker-compose-build.yaml build --parallel
# b. Push:  TENANT=uongbi docker compose -f docker-compose-build.yaml push
# Available tenants: uongbi, deonaicocsau, (thêm tenant mới → tạo file tenants/{tenant}.env)
#####
services:
  reverse_proxy_service:
    build:
      context: ./reverse_proxy
    image: ${REGISTRY}/${TENANT}_reverse_proxy_img:${VERSION}

  backend_service:
    build:
      context: ./be
      args:
        - SPRING_PROFILE=${SPRING_PROFILE:-prod}
    image: ${REGISTRY}/${TENANT}_backend_img:${VERSION}

  frontend_service:
    build:
      context: ./fe-modul-report
      args:
        - TENANT=${TENANT}
    image: ${REGISTRY}/${TENANT}_frontend_img:${VERSION}
