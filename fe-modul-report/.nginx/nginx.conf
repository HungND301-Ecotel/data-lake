# Tệp này được nạp vào ảnh nginx (xem Dockerfile), nên mọi đường dẫn và upstream
# phải nói theo góc nhìn *bên trong container*, không phải máy chủ.
server {
    listen 6228;
    server_name _;

    # Dockerfile chép bundle vào đây; trước kia dòng này trỏ vào đường dẫn trên
    # máy chủ cũ nên nginx không thấy index.html và rơi vào vòng lặp chuyển
    # hướng, trả 500 cho mọi yêu cầu.
    root /usr/share/nginx/html;
    index index.html;

    # Tên dịch vụ trong docker-compose; DNS nội bộ của Docker phân giải.
    # 127.0.0.1 là chính container nginx, nơi không có backend nào lắng nghe.
    location /datalake-api/ {
        proxy_pass http://worker:2803/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            return 204;
        }
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            return 204;
        }
        # Tải tệp lên qua backend có thể lâu; giữ hạn giờ rộng như nhánh trên.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 200m;
    }

    # Ứng dụng một trang: mọi đường dẫn không phải tệp tĩnh đều trả về index.html
    # để React Router tự định tuyến.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
