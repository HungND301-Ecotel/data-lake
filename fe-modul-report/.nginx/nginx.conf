# ============================================================
# NGINX CONFIG - BARE-METAL DEPLOYMENT ONLY
# ============================================================
# File này dùng khi deploy KHÔNG qua Docker (Nginx cài thẳng trên server).
# VD: Uông Bí - chạy JAR + npm build trực tiếp trên server.
#
# ⚠️ KHÔNG dùng file này trong Docker build (xem fe-modul-report/Dockerfile).
# Trong Docker: Nginx reverse proxy container (reverse_proxy_service) đảm nhận
# vai trò này, với config từ reverse_proxy/nginx_staging.conf hoặc nginx_release.conf.
# ============================================================

server {
    listen 6228;
    server_name _;

    root /home/ecotel-admin/datalake/data-lake/fe-modul-report/dist;
    index index.html;

    location /datalake-api/ {
        proxy_pass http://127.0.0.1:1313/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            return 204;
        }
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            return 204;
        }
    }

    location / {
        try_files $uri /index.html;
    }
}
